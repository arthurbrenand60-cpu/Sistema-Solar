<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Solar 3D ao vivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap">
<style>
:root{--bg:#05060d;--ink:#e8eefc;--dim:#8b96b8;--sun:#ffb347;--panel:rgba(12,15,30,.72);--line:rgba(160,180,255,.18);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;touch-action:none}
#c canvas{display:block}
.lbl{position:fixed;left:0;top:0;font-size:12px;color:var(--ink);padding:3px 7px;border-radius:10px;background:rgba(5,6,13,.55);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transform:translate(-50%,-150%)}
.lbl.on{border-color:var(--sun);color:var(--sun)}
header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
h1{margin:0;font-size:17px;font-weight:600}
#clock{font-size:12px;color:var(--dim);margin-top:2px}
.speeds{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
button.on{background:var(--sun);color:#1a1100;border-color:var(--sun)}
#live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#58e08a;margin-right:6px}
footer{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#info{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;backdrop-filter:blur(10px);max-width:520px}
#info h2{margin:0 0 2px;font-size:18px}
#info p{margin:0 0 8px;font-size:13px;color:var(--dim);line-height:1.4}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.g span{color:var(--dim);display:block;font-size:11px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="c"></div>
<header>
  <div><h1>Sistema Solar 3D</h1><div id="clock"></div></div>
  <div class="speeds" id="speeds">
    <button id="live" class="on" data-s="0"><i></i>Ao vivo</button>
    <button data-s="1">1 dia/s</button>
    <button data-s="30">1 mês/s</button>
    <button data-s="365">1 ano/s</button>
  </div>
</header>
<footer>
  <div id="info"></div>
  <div id="chips"></div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var D2R=Math.PI/180, AU=149597870.7;
// elementos keplerianos (JPL, 1800–2050): a,da, e,de, I,dI, L,dL, ϖ,dϖ, Ω,dΩ  (por século)
var P=[
{n:'Mercúrio',r:.55,t:'rock',c:[150,140,130],el:[.38709927,.00000037,.20563593,.00001906,7.00497902,-.00594749,252.2503235,149472.67411175,77.45779628,.16047689,48.33076593,-.12534081],f:'O planeta mais rápido: dá a volta no Sol em 88 dias.'},
{n:'Vênus',r:.95,t:'rock',c:[220,185,120],el:[.72333566,.0000039,.00677672,-.00004107,3.39467605,-.0007889,181.9790995,58517.81538729,131.60246718,.00268329,76.67984255,-.27769418],f:'O mais quente de todos, com atmosfera densa de CO₂.'},
{n:'Terra',r:1,t:'earth',c:[40,90,190],el:[1.00000261,.00000562,.01671123,-.00004392,-.00001531,-.01294668,100.46457166,35999.37244981,102.93768193,.32327364,0,0],f:'Nosso lar. A Lua orbita ao lado, em escala exagerada.'},
{n:'Marte',r:.75,t:'rock',c:[190,100,60],el:[1.52371034,.00001847,.0933941,.00007882,1.84969142,-.00813131,-4.55343205,19140.30268499,-23.94362959,.44441088,49.55953891,-.29257343],f:'O planeta vermelho tem o maior vulcão do Sistema Solar.'},
{n:'Júpiter',r:2.6,t:'gas',c:[205,170,135],el:[5.202887,-.00011607,.04838624,-.00013253,1.30439695,-.00183714,34.39644051,3034.74612775,14.72847983,.21252668,100.47390909,.20469106],f:'Gigante gasoso com mais de 90 luas conhecidas.'},
{n:'Saturno',r:2.2,t:'gas',ring:1,c:[225,200,150],el:[9.53667594,-.0012506,.05386179,-.00050991,2.48599187,.00193609,49.95424423,1222.49362201,92.59887831,-.41897216,113.66242448,-.28867794],f:'Seus anéis são feitos de gelo e rocha.'},
{n:'Urano',r:1.6,t:'gas',c:[150,215,225],el:[19.18916464,-.00196176,.04725744,-.00004397,.77263783,-.00242939,313.23810451,428.48202785,170.9542763,.40805281,74.01692503,.0424058],f:'Gira “deitado”, com o eixo quase paralelo à órbita.'},
{n:'Netuno',r:1.6,t:'gas',c:[60,100,220],el:[30.06992276,.00026291,.00859048,.00005105,1.77004347,.00035372,-55.12002969,218.45945325,44.96476227,-.32241464,131.78422574,-.00508664],f:'Ventos de mais de 2.000 km/h. Uma volta no Sol leva 165 anos.'}
];
function f(r){return 12*Math.pow(r,.55)}               // escala comprimida (só o raio; direção real)
function vis(v){var r=v.length();return r?v.clone().multiplyScalar(f(r)/r):v.clone()}
function elems(p,T){var g=function(i){return p.el[i]+p.el[i+1]*T};return{a:g(0),e:g(2),I:g(4)*D2R,L:g(6),w:g(8),N:g(10)*D2R}}
function anomaly(o){var M=(((o.L-o.w)%360)+540)%360-180;M*=D2R;var E=M+o.e*Math.sin(M);for(var i=0;i<8;i++)E-=(E-o.e*Math.sin(E)-M)/(1-o.e*Math.cos(E));return E}
function at(o,E){
  var xp=o.a*(Math.cos(E)-o.e),yp=o.a*Math.sqrt(1-o.e*o.e)*Math.sin(E);
  var om=o.w*D2R-o.N,cw=Math.cos(om),sw=Math.sin(om),cN=Math.cos(o.N),sN=Math.sin(o.N),cI=Math.cos(o.I),sI=Math.sin(o.I);
  var x=(cw*cN-sw*sN*cI)*xp+(-sw*cN-cw*sN*cI)*yp;
  var y=(cw*sN+sw*cN*cI)*xp+(-sw*sN+cw*cN*cI)*yp;
  var z=(sw*sI)*xp+(cw*sI)*yp;
  return new THREE.Vector3(x,z,-y);                    // eclíptica → eixo Y para cima
}
function jd(ms){return ms/86400000+2440587.5}

// ---------- cena ----------
var host=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
host.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(50,1,.1,4000);
scene.add(new THREE.AmbientLight(0x404868,.9));
var sunLight=new THREE.PointLight(0xfff2dd,2.2,0,0);scene.add(sunLight);

function canvasTex(p){
  var c=document.createElement('canvas');c.width=256;c.height=128;var g=c.getContext('2d');
  var b=p.c,rgb=function(k){return'rgb('+Math.max(0,Math.min(255,b[0]*k|0))+','+Math.max(0,Math.min(255,b[1]*k|0))+','+Math.max(0,Math.min(255,b[2]*k|0))+')'};
  g.fillStyle=rgb(1);g.fillRect(0,0,256,128);
  var i;
  if(p.t==='gas'){for(i=0;i<22;i++){g.fillStyle=rgb(.75+Math.random()*.5);g.globalAlpha=.55;g.fillRect(0,Math.random()*128,256,3+Math.random()*10)}}
  else{for(i=0;i<70;i++){g.fillStyle=p.t==='earth'?(Math.random()<.55?'rgb(60,140,70)':'rgb(235,240,245)'):rgb(.6+Math.random()*.7);g.globalAlpha=.5;g.beginPath();g.arc(Math.random()*256,Math.random()*128,3+Math.random()*14,0,7);g.fill()}}
  return new THREE.CanvasTexture(c);
}
function glow(col,size){
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
  var gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,col);gr.addColorStop(.3,col.replace('1)','.35)'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.set(size,size,1);return s;
}
// estrelas
(function(){
  var n=2600,a=new Float32Array(n*3);
  for(var i=0;i<n;i++){var u=Math.random()*2-1,t=Math.random()*6.2832,s=Math.sqrt(1-u*u),R=1500+Math.random()*500;a[i*3]=R*s*Math.cos(t);a[i*3+1]=R*u;a[i*3+2]=R*s*Math.sin(t)}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfd8ff,size:2.2,sizeAttenuation:false})));
})();
// Sol
var sun=new THREE.Mesh(new THREE.SphereGeometry(4,32,24),new THREE.MeshBasicMaterial({color:0xffc066}));
scene.add(sun);scene.add(glow('rgba(255,190,90,1)',46));

var T0=(jd(Date.now())-2451545)/36525;
var bodies=[],labels=[];
function mkLabel(name,idx){
  var d=document.createElement('div');d.className='lbl';d.textContent=name;
  d.onclick=function(){select(idx)};document.body.appendChild(d);return d;
}
labels.push(mkLabel('Sol',-1));
P.forEach(function(p,i){
  var o=elems(p,T0),pts=[];
  for(var k=0;k<=256;k++)pts.push(vis(at(o,k/256*6.2832)));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x7f8fcf,transparent:true,opacity:.35})));
  var grp=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(p.r,32,24),new THREE.MeshStandardMaterial({map:canvasTex(p),roughness:.9}));
  grp.add(m);
  if(p.ring){var rg=new THREE.Mesh(new THREE.RingGeometry(p.r*1.4,p.r*2.3,64),new THREE.MeshBasicMaterial({color:0xd9c7a0,side:THREE.DoubleSide,transparent:true,opacity:.7}));rg.rotation.x=Math.PI/2;grp.add(rg);grp.rotation.z=.46}
  scene.add(grp);
  bodies.push({p:p,grp:grp,mesh:m,true:new THREE.Vector3(),pos:new THREE.Vector3()});
  labels.push(mkLabel(p.n,i));
});
var moon=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),new THREE.MeshStandardMaterial({color:0xbbbbbb,roughness:1}));scene.add(moon);

// ---------- tempo ----------
var simMs=Date.now(),speed=0,fmt=new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeStyle:'medium'});
document.getElementById('speeds').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  speed=+b.dataset.s;if(!speed)simMs=Date.now();
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});
});

// ---------- câmera ----------
var target=new THREE.Vector3(),goalT=new THREE.Vector3(),dist=190,goalD=190,th=.8,ph=1.05,sel=-2,follow=true;
function select(i){
  sel=i;follow=true;
  goalD=i<0?(i===-1?24:190):bodies[i].p.r*7+3;
  if(i===-2)goalT.set(0,0,0);
  labels.forEach(function(l,k){l.classList.toggle('on',k-1===i)});
  chips.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i)});
  info(true);
}
var ptr={},last=0;
host.addEventListener('pointerdown',function(e){host.setPointerCapture(e.pointerId);ptr[e.pointerId]={x:e.clientX,y:e.clientY}});
host.addEventListener('pointerup',function(e){delete ptr[e.pointerId]});
host.addEventListener('pointercancel',function(e){delete ptr[e.pointerId]});
host.addEventListener('pointermove',function(e){
  var q=ptr[e.pointerId];if(!q)return;
  var ids=Object.keys(ptr),dx=e.clientX-q.x,dy=e.clientY-q.y;
  if(ids.length===2){
    var o=ptr[ids[0]==e.pointerId?ids[1]:ids[0]],d0=Math.hypot(q.x-o.x,q.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    goalD=Math.max(1.5,Math.min(600,goalD*d0/Math.max(d1,1)));
  }else{th-=dx*.006;ph=Math.max(.08,Math.min(3.06,ph-dy*.006))}
  q.x=e.clientX;q.y=e.clientY;
});
host.addEventListener('wheel',function(e){e.preventDefault();goalD=Math.max(1.5,Math.min(600,goalD*(1+e.deltaY*.001)))},{passive:false});

// ---------- UI ----------
var chips=document.getElementById('chips'),box=document.getElementById('info');
function chip(t,i){var b=document.createElement('button');b.textContent=t;b.dataset.i=i;b.onclick=function(){select(i)};chips.appendChild(b)}
chip('Visão geral',-2);chip('Sol',-1);P.forEach(function(p,i){chip(p.n,i)});
var infoT=0;
function nf(x,d){return x.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d})}
function info(force){
  var now=performance.now();if(!force&&now-infoT<400)return;infoT=now;
  if(sel===-2){box.innerHTML='<h2>Sistema Solar ao vivo</h2><p>Arraste para girar, pince ou role para dar zoom e toque em um planeta para visitá-lo. As distâncias entre órbitas estão comprimidas para caber na tela, mas os ângulos são reais.</p>';return}
  if(sel===-1){box.innerHTML='<h2>Sol</h2><p>A estrela no centro de tudo, com 99,8% da massa do Sistema Solar.</p><div class="g"><div><span>Distância da Terra</span>'+nf(bodies[2].true.length(),3)+' UA</div><div><span>A luz chega em</span>'+nf(bodies[2].true.length()*8.31675,1)+' min</div></div>';return}
  var b=bodies[sel],r=b.true.length(),de=b.true.distanceTo(bodies[2].true),lon=(Math.atan2(-b.true.z,b.true.x)/D2R+360)%360;
  box.innerHTML='<h2>'+b.p.n+'</h2><p>'+b.p.f+'</p><div class="g">'+
   '<div><span>Distância do Sol</span>'+nf(r,3)+' UA · '+nf(r*AU/1e6,1)+' mi km</div>'+
   (sel===2?'<div><span>Luz do Sol chega em</span>'+nf(r*8.31675,1)+' min</div>':'<div><span>Distância da Terra</span>'+nf(de,3)+' UA · '+nf(de*AU/1e6,1)+' mi km</div>')+
   (sel===2?'':'<div><span>Luz leva até aqui</span>'+nf(de*8.31675,1)+' min</div>')+
   '<div><span>Longitude em torno do Sol</span>'+nf(lon,1)+'°</div></div>';
}

// ---------- loop ----------
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
var clock=document.getElementById('clock'),V=new THREE.Vector3();
function frame(t){
  var dt=Math.min((t-last)/1000,.1);last=t;
  if(speed)simMs+=dt*speed*86400000;else simMs=Date.now();
  var T=(jd(simMs)-2451545)/36525;
  bodies.forEach(function(b){
    var o=elems(b.p,T);b.true=at(o,anomaly(o));b.pos=vis(b.true);b.grp.position.copy(b.pos);b.mesh.rotation.y+=dt*.4;
  });
  var d=jd(simMs)-2451545,ma=(218.316+13.176396*d)*D2R;
  moon.position.copy(bodies[2].pos).add(new THREE.Vector3(Math.cos(ma)*2.4,0,-Math.sin(ma)*2.4));
  if(sel>=0)goalT.copy(bodies[sel].pos);else if(sel===-1||sel===-2)goalT.set(0,0,0);
  target.lerp(goalT,Math.min(1,dt*4));dist+=(goalD-dist)*Math.min(1,dt*3);
  cam.position.set(target.x+dist*Math.sin(ph)*Math.cos(th),target.y+dist*Math.cos(ph),target.z+dist*Math.sin(ph)*Math.sin(th));
  cam.lookAt(target);
  renderer.render(scene,cam);
  var w=innerWidth,h=innerHeight;
  labels.forEach(function(l,k){
    V.copy(k===0?sun.position:bodies[k-1].pos).project(cam);
    var vis=V.z<1&&Math.abs(V.x)<1.1&&Math.abs(V.y)<1.1;
    l.style.display=vis?'block':'none';
    if(vis)l.style.transform='translate('+((V.x*.5+.5)*w)+'px,'+((-V.y*.5+.5)*h)+'px) translate(-50%,-170%)';
  });
  clock.textContent=fmt.format(new Date(simMs))+(speed?'':' · hora real');
  info(false);
  requestAnimationFrame(frame);
}
select(-2);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
